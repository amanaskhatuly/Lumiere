<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sozo Lumiere — онлайн-запись</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe9;--tx:#1d1a17;--mu:#7d746c;--ac:#8a3b2c;--bd:#d9d1c8;--soft:#e9e2d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141210;--tx:#efe9e2;--mu:#9a9189;--ac:#d68a76;--bd:#332d29;--soft:#221e1b}}
:root[data-theme="dark"]{--bg:#141210;--tx:#efe9e2;--mu:#9a9189;--ac:#d68a76;--bd:#332d29;--soft:#221e1b}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0 18px;border-bottom:1px solid var(--tx)}
.logo{font:400 28px/1 "Instrument Serif",Georgia,serif;letter-spacing:.01em}
.tel{font-size:14px;text-decoration:none}
.serif,h1,h3,.d b,.opt span{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.meta{display:flex;justify-content:space-between;margin-top:34px;font-size:13px;color:var(--mu);letter-spacing:.08em}
.back{background:none;border:0;color:var(--mu);font:500 13px Manrope,system-ui,sans-serif;cursor:pointer;padding:0}
.back:hover{color:var(--tx)}
.line{height:1px;background:var(--bd);margin:10px 0 28px}.line i{display:block;height:1px;background:var(--tx)}
h1{font-size:clamp(42px,10vw,64px);line-height:1;margin:0 0 10px;letter-spacing:-.01em}
.mu{color:var(--mu)}.sub{margin:0 0 6px;font-size:15px}
.crumb{font-size:14px;color:var(--mu);margin:0 0 24px}
.btn{display:inline-block;border:1px solid var(--tx);background:var(--tx);color:var(--bg);padding:15px 28px;font:600 14px Manrope,system-ui,sans-serif;letter-spacing:.03em;cursor:pointer;text-decoration:none;text-align:center;border-radius:2px;transition:background .15s,color .15s}
.btn:hover{background:transparent;color:var(--tx)}.btn:disabled{opacity:.3;cursor:not-allowed;background:var(--tx);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--tx)}.btn.ghost:hover{background:var(--tx);color:var(--bg)}
.rows{margin-top:22px;border-top:1px solid var(--bd)}
.branch{padding:26px 0;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
.branch h3{font-size:32px;line-height:1.1;margin:0 0 6px}
.branch p{margin:0;font-size:14px;color:var(--mu)}
.branch a{font-size:13px;color:var(--mu);display:inline-block;margin-top:8px}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:14px;width:100%;text-align:left;background:none;color:var(--tx);border:0;border-bottom:1px solid var(--bd);padding:20px 0;font:500 14px Manrope,system-ui,sans-serif;cursor:pointer}
.opt span{font-size:26px;line-height:1.15}
.opt small{display:block;font:400 13px Manrope,system-ui,sans-serif;color:var(--mu);margin-top:2px}
.opt:hover span{color:var(--ac);font-style:italic}
.cal-h{font-size:13px;color:var(--mu);margin:0 0 10px;text-transform:capitalize;letter-spacing:.04em}
.dates{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 24px}
.wdn{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);text-align:center;padding:4px 0}
.d{aspect-ratio:1;background:none;color:var(--tx);border:1px solid var(--bd);border-radius:2px;cursor:pointer;font:400 24px/1 "Instrument Serif",Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.d small{font:500 9px Manrope,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-top:2px}
.d:hover:not(:disabled){border-color:var(--tx)}
.d:disabled{opacity:.28;cursor:not-allowed;border-color:transparent}
.d.we{color:var(--ac)}
.d.today{border-color:var(--tx)}
.d.sel small{color:var(--bg)}


.d.sel,.t.sel{background:var(--tx);color:var(--bg)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin:0 0 28px}
.t{background:none;color:var(--tx);border:1px solid var(--bd);border-radius:2px;padding:11px 0;font:500 14px Manrope,system-ui,sans-serif;cursor:pointer}
.t:hover:not(:disabled){border-color:var(--tx)}
.t:disabled{opacity:.28;text-decoration:line-through;cursor:not-allowed}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 0 2px}
input,textarea{width:100%;border:0;border-bottom:1px solid var(--bd);background:transparent;color:var(--tx);padding:10px 0;font:18px Manrope,system-ui,sans-serif;border-radius:0;resize:none}
input:focus,textarea:focus{outline:0;border-bottom-color:var(--tx)}
.err{color:#c0463a;font-size:13px;min-height:20px;margin:10px 0}
.sum{border-top:1px solid var(--tx);margin:26px 0}
.sum div{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid var(--bd);font-size:15px}
.sum span{color:var(--mu)}.sum b{text-align:right;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mu);margin-top:18px}
main{padding-bottom:60px;min-height:60vh}
footer{border-top:1px solid var(--tx);padding:24px 0 40px;font-size:13px;color:var(--mu)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:16px}
footer b{color:var(--tx);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">Sozo Lumiere</div><a class="tel" href="tel:+77028888896">+7 (702) 888-88-96</a></header>
<main id="app"></main>
<footer>
<div class="fg"><div><b>пр. Аль-Фараби, 69Б</b><br>Бостандыкский район, Алматы<br><a href="https://2gis.kz/almaty/geo/70030076373486575" target="_blank" rel="noopener">Открыть в 2ГИС ↗</a></div></div>
Ежедневно 09:00–20:00 · Алматы · <a href="tel:+77028888896">+7 (702) 888-88-96</a><br>
<span style="opacity:.7">Демо: услуги, цены и свободное время — примеры.</span>
</footer>
</div>
<script>
const B=[{id:'a',a:'пр. Аль-Фараби, 69Б',f:'',d:'Бостандыкский район',m:'https://2gis.kz/almaty/geo/70030076373486575'}];
const S=[['Женская стрижка',60,7000],['Женская укладка',45,5000],['Окрашивание в один тон',150,15000],['Сложное окрашивание',240,30000],['Мужская стрижка',45,4000]];
const st={s:1,b:'a',v:null,d:null,t:null,name:'',ph:'+7',cm:''};
const app=document.getElementById('app');
const esc=x=>x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pr=n=>n.toLocaleString('ru-RU')+' ₸';
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dur=m=>m>=60?(Math.floor(m/60)+' ч'+(m%60?' '+m%60+' мин':'')):m+' мин';
const T0=new Date();T0.setHours(0,0,0,0);
const DAYS=[...Array(35)].map((_,i)=>{const d=new Date(T0);d.setDate(d.getDate()-((T0.getDay()+6)%7)+i);return d});
const TI=DAYS.findIndex(d=>d.getTime()==T0.getTime());
const ml=d=>d.toLocaleDateString('ru-RU',{month:'long'});
const dl=d=>d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const busy=k=>{let h=7;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return h%100<32};
function fp(v){let d=v.replace(/\D/g,'');if(d[0]=='7'||d[0]=='8')d=d.slice(1);d=d.slice(0,10);let r='+7';if(d.length)r+=' ('+d.slice(0,3);if(d.length>3)r+=') '+d.slice(3,6);if(d.length>6)r+='-'+d.slice(6,8);if(d.length>8)r+='-'+d.slice(8);return r}
const go=n=>{st.s=n;draw();if(n)window.scrollTo({top:0,behavior:'smooth'})};
const bo=()=>B.find(x=>x.id==st.b), sv=()=>S[st.v];
function head(t,sub){
return `<div class="meta"><span>0${st.s} / 03</span>${st.s>1?'<button class="back" data-go="'+(st.s-1)+'">← Назад</button>':''}</div><div class="line"><i style="width:${st.s*33.34}%"></i></div><h1>${t}</h1>${sub?`<p class="mu sub">${sub}</p>`:''}`}
const crumb=()=>`<p class="crumb">${[st.b?bo().a:'',st.v!=null?sv()[0]:''].filter(Boolean).join(' · ')}</p>`;
function slots(){
const el=document.getElementById('slots');if(!el)return;
const dd=DAYS[st.d],now=new Date(),isT=dd.getTime()==T0.getTime(),nm=now.getHours()*60+now.getMinutes()+30,L=sv()[1];let h='';
for(let m=540;m<=1200-L;m+=30){const off=(isT&&m<nm)||busy(st.b+dd.getTime()+m);
h+=`<button class="t${st.t==m?' sel':''}" data-t="${m}"${off?' disabled':''}>${hm(m)}</button>`}
el.innerHTML=h||'<span class="mu">Нет свободного времени</span>'}
function draw(){
let h='';
if(st.s==0){
h=head('Филиал','Выберите адрес, куда удобнее приехать')+`<div class="rows">${B.map(b=>`<div class="branch"><div><h3>${b.a}</h3><p>${b.f} · ${b.d}</p><a href="${b.m}" target="_blank" rel="noopener">Открыть в 2ГИС ↗</a></div><button class="btn" data-b="${b.id}">Выбрать</button></div>`).join('')}</div>`}
else if(st.s==1){
h=head('Услуга')+crumb()+`<div class="rows" style="margin-top:0">${S.map((s,i)=>`<button class="opt" data-v="${i}"><span>${s[0]}<small>${dur(s[1])}</small></span><strong>${pr(s[2])}</strong></button>`).join('')}</div>`}
else if(st.s==2){
if(st.d==null)st.d=TI;
h=head('Дата и время')+crumb()+`<p class="cal-h">${ml(T0)}${ml(DAYS[34])!=ml(T0)?' — '+ml(DAYS[34]):''} ${DAYS[34].getFullYear()}</p><div class="dates">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<div class="wdn">${w}</div>`).join('')}${DAYS.map((d,i)=>`<button class="d${st.d==i?' sel':''}${i==TI?' today':''}${i%7>4?' we':''}" data-d="${i}"${i<TI?' disabled':''}>${d.getDate()}${d.getDate()==1?'<small>'+ml(d).slice(0,3)+'</small>':''}</button>`).join('')}</div><div class="slots" id="slots"></div><button class="btn" id="nx" ${st.t==null?'disabled':''}>Продолжить</button>`}
else if(st.s==3){
h=head('Контакты')+`<p class="crumb">${bo().a} · ${sv()[0]} · ${dl(DAYS[st.d])}, ${hm(st.t)}</p><label for="nm">Имя</label><input id="nm" autocomplete="name" value="${esc(st.name)}"><label for="ph">Телефон</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" value="${esc(st.ph)}"><label for="cm">Пожелания</label><textarea id="cm" rows="2" placeholder="Необязательно">${esc(st.cm)}</textarea><div class="err" id="er"></div><button class="btn" id="sb">Записаться</button>`}
else{
const msg=`Здравствуйте! Хочу записаться в Sozo Lumiere.\nАдрес: ${bo().a}\nУслуга: ${sv()[0]}\nКогда: ${dl(DAYS[st.d])}, ${hm(st.t)}\nИмя: ${st.name}\nТелефон: ${st.ph}`+(st.cm?`\nПожелания: ${st.cm}`:'');
h=`<div class="meta"><span>Готово</span></div><div class="line"><i style="width:100%"></i></div><h1>Заявка готова</h1><p class="mu sub">Остался один шаг — отправьте её в салон.</p>
<div class="sum"><div><span>Адрес</span><b>${bo().a}</b></div><div><span>Услуга</span><b>${sv()[0]}</b></div><div><span>Время</span><b>${dl(DAYS[st.d])}, ${hm(st.t)}</b></div><div><span>Стоимость</span><b>${pr(sv()[2])}</b></div><div><span>Клиент</span><b>${esc(st.name)}, ${esc(st.ph)}</b></div></div>
<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/77028888896?text=${encodeURIComponent(msg)}">Отправить в WhatsApp</a><a class="btn ghost" href="tel:+77028888896">Позвонить</a><button class="btn ghost" data-new="1">Новая запись</button></div>
<p class="note">Демо: заявка не уходит автоматически. Кнопка WhatsApp открывает готовое сообщение на номер салона, останется нажать «Отправить».</p>`}
app.innerHTML=h;if(st.s==2)slots();
const ph=document.getElementById('ph');if(ph)ph.addEventListener('input',()=>{ph.value=fp(ph.value)})}
app.addEventListener('click',e=>{
const t=e.target.closest('button');if(!t)return;const D=t.dataset;
if(D.b){st.b=D.b;go(1)}
else if(D.v){st.v=+D.v;st.t=null;go(2)}
else if(D.d){st.d=+D.d;st.t=null;document.querySelectorAll('.d').forEach(x=>x.classList.toggle('sel',x==t));document.getElementById('nx').disabled=true;slots()}
else if(D.t){st.t=+D.t;document.querySelectorAll('.t').forEach(x=>x.classList.toggle('sel',x==t));document.getElementById('nx').disabled=false}
else if(D.go!==undefined)go(+D.go);
else if(D.new){Object.assign(st,{v:null,d:null,t:null,cm:''});go(1)}
else if(t.id=='nx')go(3);
else if(t.id=='sb'){
st.name=document.getElementById('nm').value.trim();st.ph=document.getElementById('ph').value;st.cm=document.getElementById('cm').value.trim();
const dg=st.ph.replace(/\D/g,'').length,er=document.getElementById('er');
if(st.name.length<2)er.textContent='Укажите имя';
else if(dg<11)er.textContent='Введите номер телефона полностью';
else go(4)}});
draw();
</script>
</body>
</html>
